name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: Official
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      release_type:
        description: "发布到 GitHub Releases"
        required: true
        type: choice
        options:
          - "不上传"
          - "Release"
          - "Pre-Release"
        default: "不上传"

      # ==================== 文本输入 ====================
      os_patch_level:
        description: "安全补丁级别 (如 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: ""
      custom_release_notes:
        description: "Release 额外说明 (可选，追加展示在发布说明下方)"
        required: false
        type: string
        default: ""

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      enable_multi_comp:
        description: "开启Multi-Comp(内核版本>=6.6)"
        required: false
        type: boolean
        default: false
      patch_multi_comp:
        description: "开启Multi-Comp修补(修补不支持的版本)"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: true
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      fix_mi14p_flicker:
        description: "补全小米14Pro驱动及修复屏幕闪烁(6.1>140自动生效)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if os_patch_level == "lts":
              kernel_full = data.get("lts")
              if not kernel_full:
                  print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                  sys.exit(1)
              sub_level = "X"
          else:
              matched = next(
                  (entry for entry in data.get("entries", []) if entry.get("date") == os_patch_level),
                  None,
              )
              if matched is None:
                  print(f"::error::未找到 {android_version} / {kernel_version} / {os_patch_level} 对应的版本数据")
                  sys.exit(1)
              kernel_full = matched.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                  sys.exit(1)
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")

          print(f"解析结果: {android_version} / {kernel_full}，子版本号: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      fix_mi14p_flicker: ${{ inputs.fix_mi14p_flicker || false }}
      enable_multi_comp: ${{ inputs.enable_multi_comp || false }}
      patch_multi_comp: ${{ inputs.patch_multi_comp || false }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  release:
    name: 发布 GitHub Release
    if: ${{ always() && !cancelled() && inputs.release_type != '不上传' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    needs:
      - resolve-version
      - get-ksu-manager
      - build-custom-kernel

    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 验证构建状态
        run: |
          if [ "${{ needs.build-custom-kernel.result }}" != "success" ]; then
            echo "::error::内核构建未成功完成 (结果: ${{ needs.build-custom-kernel.result }})，跳过 Release 发布"
            exit 1
          fi

      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 设置发布信息与环境变量
        run: |
          ANDROID_VER="${{ needs.resolve-version.outputs.android_version }}"
          KERNEL_FULL="${{ needs.resolve-version.outputs.kernel_full }}"
          PATCH_LEVEL="${{ inputs.os_patch_level }}"
          KSU_VARIANT="${{ inputs.kernelsu_variant }}"

          case "$KSU_VARIANT" in
            "Next")      KSU_NAME="KernelSU-Next" ;;
            "Official")  KSU_NAME="KernelSU" ;;
            "SukiSU"|"SukiSU(40726)"|"SukiSU(40548)") KSU_NAME="SukiSU" ;;
            "BakaSU")    KSU_NAME="BakaSU" ;;
            *)           KSU_NAME="$KSU_VARIANT" ;;
          esac

          ZRAM_STR="${{ inputs.use_zram && '开启' || '未开启' }}"
          BBG_STR="${{ inputs.use_bbg && '支持' || '不支持' }}"
          NET_STR="${{ inputs.use_networking && '开启' || '未开启' }}"
          NOMOUNT_STR="${{ inputs.use_nomount && '开启' || '未开启' }}"
          MI14P_STR="${{ inputs.fix_mi14p_flicker && '已启用' || '未启用' }}"

          if [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            KPM_STR="支持"
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            KPM_STR="支持（补丁尚不支持）"
          else
            KPM_STR="未开启"
          fi

          CUSTOM_VER="${{ inputs.version }}"
          DATE_STR=$(date -u +'%Y%m%d_%H%M')

          if [ -n "$CUSTOM_VER" ]; then
            RELEASE_TITLE="GKI Kernel: ${CUSTOM_VER} (${KERNEL_FULL}-${PATCH_LEVEL})"
            TAG_BASE="${CUSTOM_VER}-${KERNEL_FULL}-${PATCH_LEVEL}"
          else
            RELEASE_TITLE="GKI Kernel: ${KERNEL_FULL}-${PATCH_LEVEL} [${KSU_NAME}]"
            TAG_BASE="${KERNEL_FULL}-${PATCH_LEVEL}-${KSU_NAME}"
          fi

          CLEAN_TAG_BASE=$(echo "$TAG_BASE" | tr -d ' ' | tr '()' '-')
          TAG_NAME="${CLEAN_TAG_BASE}-${DATE_STR}"

          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV
          echo "KERNEL_FULL=$KERNEL_FULL" >> $GITHUB_ENV
          echo "PATCH_LEVEL=$PATCH_LEVEL" >> $GITHUB_ENV
          echo "ZRAM_STR=$ZRAM_STR" >> $GITHUB_ENV
          echo "BBG_STR=$BBG_STR" >> $GITHUB_ENV
          echo "NET_STR=$NET_STR" >> $GITHUB_ENV
          echo "NOMOUNT_STR=$NOMOUNT_STR" >> $GITHUB_ENV
          echo "MI14P_STR=$MI14P_STR" >> $GITHUB_ENV
          echo "KPM_STR=$KPM_STR" >> $GITHUB_ENV

      - name: 生成 Release 说明
        env:
          CUSTOM_NOTES: ${{ inputs.custom_release_notes }}
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > release_body.md << EOF
          ## GKI Custom Kernel Release

          **内核版本**: \`${KERNEL_FULL}\` (${PATCH_LEVEL})
          **集成变体**: \`${KSU_NAME}\` (模式: ${{ inputs.ksu_mode }})

          | 项目 | 内容 |
          |:---|:---|
          | 发布类型 | ${{ inputs.release_type }} |
          | 构建时间 | $BUILD_DATE |
          | 安全补丁级别 | ${PATCH_LEVEL} |
          | AnyKernel3 刷机包 | 见下方 Assets 附件 |

          ### 功能特性

          | 功能特性 | 状态 |
          |:---|:---|
          | KernelSU 变体 | ${KSU_NAME} |
          | KernelSU / SUSFS 模式 | ${{ inputs.ksu_mode }} |
          | ZRAM / LZ4 压缩增强 | ${ZRAM_STR} |
          | BBG 防格机保护 | ${BBG_STR} |
          | 网络增强 (BBRv3 / IPSet / CIFS) | ${NET_STR} |
          | NoMount 挂载模块 | ${NOMOUNT_STR} |
          | KPM 功能 | ${KPM_STR} |
          | 小米14Pro 屏幕/驱动修复 | ${MI14P_STR} |

          ### 刷入与安全提示

          > [!IMPORTANT]
          > 1. 刷入内核前**务必在 TWRP / Recovery 或系统中备份原厂 Boot 镜像**。
          > 2. 请根据你的机型及需求选择刷入 AnyKernel3 刷机包或提取 boot 镜像。
          > 3. 若遇到任何启动异常，请第一时间刷回官方 Boot 镜像恢复。

          EOF

          if [ -n "${CUSTOM_NOTES}" ]; then
            printf "\n### 📢 额外说明\n\n%s\n" "${CUSTOM_NOTES}" >> release_body.md
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: 整理发布附件
        run: |
          mkdir -p ./release-assets

          # 1. 处理 AnyKernel3 与镜像产物
          for d in ./downloaded-artifacts/*_kernel-*; do
            [ -d "$d" ] || continue
            [[ "$d" == *-Rejects* ]] && continue

            find "$d" -maxdepth 1 -type f \( -name "*.zip" -o -name "*.img" \) -exec cp -t ./release-assets/ {} +

            if [ -f "$d/anykernel.sh" ] && ! find "$d" -maxdepth 1 -name "*.zip" | grep -q .; then
              ZIP_NAME="${KERNEL_FULL}-${PATCH_LEVEL}-AnyKernel3.zip"
              echo "打包 AnyKernel3 目录为 $ZIP_NAME..."
              (cd "$d" && zip -r "../../release-assets/$ZIP_NAME" ./*)
            fi
          done

          # 2. 复制管理器 APK 与 SUSFS 模块（若有）
          find ./downloaded-artifacts -type f -name "*.apk" -exec cp -t ./release-assets/ {} +
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -exec cp -t ./release-assets/ {} +

          echo "准备上传的 Release 附件列表:"
          ls -lh ./release-assets/

      - name: 创建 GitHub Release 并上传附件
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "创建 Release 标签: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

          echo "正在上传附件到 Release..."
          for asset in ./release-assets/*; do
            [ -f "$asset" ] || continue
            echo "上传: $asset"
            gh release upload "$TAG_NAME" "$asset" --clobber || true
          done

      - name: 发布构建摘要
        run: |
          echo "## 🚀 GitHub Release 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **标题**: $RELEASE_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "- **类型**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
