name: GetManager
permissions:
  contents: write
  actions: read

on:
  schedule:
    # 每两天北京时间早上 08:00 (UTC 00:00) 自动定时执行一次全量获取与构建
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 分支/变体 (定时运行或选 All 时自动获取所有主流变体)"
        required: true
        type: choice
        default: "All"
        options:
          - "All"
          - "Official"
          - "Next"
          - "SukiSU"
          - "BakaSU"
          - "SukiSU(40726)"
          - "SukiSU(40548)"
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      ksuVer: ${{ steps.try_reuse.outputs.reused == 'true' && steps.try_reuse.outputs.kversion || steps.get_version.outputs.kversion }}
      susVer: ${{ steps.try_reuse.outputs.reused == 'true' && steps.try_reuse.outputs.sversion || steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq zip unzip

      # =========================================================================
      # 流程 1: 消费端快速复用
      # 当由内核构建工作流调用 (workflow_call) 或指定单变体运行时，
      # 优先从 GetManager 独立工作流最新一次成功定时运行的产物中直接提取，免去重复爬取与编译！
      # =========================================================================
      - name: 优先从 GetManager 最新工作流产物复用
        id: try_reuse
        run: |
          TARGET_VARIANT="${{ inputs.kernelsu_variant }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" == "schedule" ] || [ "$TARGET_VARIANT" == "All" ]; then
            echo "当前为定时全量更新或手动全量获取模式，跳过复用，直接执行完整采集与构建流程..."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔍 当前为按需获取模式 ($TARGET_VARIANT)，正在检索 GetManager 工作流最新成功产物..."
          LATEST_RUN_ID=$(gh run list --workflow=get-manager.yml -R "$GITHUB_REPOSITORY" --status=success --limit 10 --json databaseId -q '.[] | select(.databaseId != '"${GITHUB_RUN_ID:-0}"') | .databaseId' | head -n 1 || true)

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "未检测到已有的 GetManager 成功运行记录，将回退至现场获取与构建流程..."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "找到最新成功记录: Run ID $LATEST_RUN_ID，尝试快速拉取产物..."
          mkdir -p fetched_cache
          if gh run download "$LATEST_RUN_ID" -R "$GITHUB_REPOSITORY" --pattern "${TARGET_VARIANT}-Manager*" --pattern "susfs-*" --pattern "nomount-module*" -D fetched_cache 2>/dev/null; then
            APK_FILE=$(find fetched_cache -type f -name "*.apk" | head -n 1 || true)
            SUS_FILE=$(find fetched_cache -type f -name "ksu_module_susfs.zip" | head -n 1 || true)
            NOMOUNT_FILE=$(find fetched_cache -type f -name "NoMount-*.zip" | head -n 1 || true)

            if [ -n "$APK_FILE" ] && [ -n "$SUS_FILE" ]; then
              echo "🎉 成功直接从 Run ID $LATEST_RUN_ID 提取到 $TARGET_VARIANT 管理器与 SUSFS 模块！"
              mkdir -p manager-artifacts susfs-module
              cp "$APK_FILE" manager-artifacts/
              cp "$SUS_FILE" susfs-module/

              if [ -n "$NOMOUNT_FILE" ]; then
                echo "🎉 顺便提取到 NoMount 模块: $(basename "$NOMOUNT_FILE")"
                mkdir -p nomount-module
                cp "$NOMOUNT_FILE" nomount-module/
                echo "HAS_NOMOUNT=true" >> "$GITHUB_ENV"
              fi

              KSU_VER=$(basename "$APK_FILE" | grep -o -E '[0-9]{5}' | head -n 1 || echo "20000")
              SUS_DIR=$(find fetched_cache -mindepth 1 -maxdepth 1 -type d -name "susfs-*" | head -n 1 || true)
              SUS_NAME=$(basename "$SUS_DIR" | sed 's/^susfs-//' || echo "release-1.5.2+")

              echo "KSU_VERSION=$KSU_VER" >> "$GITHUB_ENV"
              echo "SUSFS_NAME=$SUS_NAME" >> "$GITHUB_ENV"
              echo "HAS_SINGLE=true" >> "$GITHUB_ENV"
              echo "SINGLE_ART_NAME=${TARGET_VARIANT}-Manager(${KSU_VER})" >> "$GITHUB_ENV"

              echo "kversion=$KSU_VER" >> "$GITHUB_OUTPUT"
              echo "sversion=$SUS_NAME" >> "$GITHUB_OUTPUT"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              rm -rf fetched_cache
              exit 0
            fi
          fi

          echo "未能匹配到完整的 $TARGET_VARIANT 产物，将回退至现场获取与构建流程..."
          echo "reused=false" >> "$GITHUB_OUTPUT"
          rm -rf fetched_cache

      # =========================================================================
      # 流程 2: 生产端全量/现场获取与构建
      # 当定时触发、手动 All 或未能命中历史产物时执行
      # =========================================================================
      - name: 获取 KSU & SUSFS 版本
        id: get_version
        if: steps.try_reuse.outputs.reused != 'true'
        run: |
          TARGET="${{ inputs.kernelsu_variant }}"
          [ -z "$TARGET" ] && TARGET="All"

          # 获取 SUSFS 官方最新版本
          INFO="https://raw.githubusercontent.com/sidex15/susfs4ksu-module/v1.5.2+/module.prop"
          SUS_VERSION=$(curl -fsSL "$INFO" | awk -F '=' '$1 == "version" { print $2 }' || true)
          [ -z "$SUS_VERSION" ] && SUS_VERSION="v1.5.2"
          echo "SUSFS_VERSION: $SUS_VERSION"
          echo "sversion=$SUS_VERSION" >> "$GITHUB_OUTPUT"

          # 若为单变体，计算其特定 KSU 版本
          if [ "$TARGET" != "All" ]; then
            case "$TARGET" in
              "Next") CLONE_URL="https://github.com/KernelSU-Next/KernelSU-Next.git" ;;
              "SukiSU") CLONE_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git" ;;
              "BakaSU") CLONE_URL="https://github.com/Baka-SU/BakaSU.git" ;;
              "Official"|*) CLONE_URL="https://github.com/tiann/KernelSU.git" ;;
            esac

            git clone --depth 1 "$CLONE_URL" KernelSU_tmp
            GIT_COUNT=$(git -C KernelSU_tmp rev-list --count HEAD)
            rm -rf KernelSU_tmp

            case "$TARGET" in
              "SukiSU") KSU_VER=$((40000 + GIT_COUNT - 2815)) ;;
              "SukiSU(40726)") KSU_VER=40726 ;;
              "SukiSU(40548)") KSU_VER=40548 ;;
              "BakaSU") KSU_VER=$((30700 + GIT_COUNT)) ;;
              "Official") KSU_VER=$((20000 + GIT_COUNT)) ;;
              "Next") KSU_VER=$((30000 + GIT_COUNT)) ;;
              *) KSU_VER=$((20000 + GIT_COUNT)) ;;
            esac
            echo "kversion=$KSU_VER" >> "$GITHUB_OUTPUT"
            echo "KSU_VERSION=$KSU_VER" >> "$GITHUB_ENV"
          else
            echo "kversion=20000" >> "$GITHUB_OUTPUT"
          fi

      - name: 添加 KernelSU 管理器
        id: add_KSU
        if: steps.try_reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          fetch_manager() {
            local V="$1"
            local OUT_DIR="$2"
            mkdir -p "$OUT_DIR"

            case "$V" in
              "SukiSU(40726)")
                local tag="v2.1.0-r2"
                local url
                url=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" |
                  jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' | head -n 1 || true)
                [ -n "$url" ] && curl -fL -o "$OUT_DIR/SukiSU_40726-release.apk" "$url"
                return 0
                ;;
              "SukiSU(40548)")
                local tag="v2.0.0-r34"
                local url
                url=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" |
                  jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' | head -n 1 || true)
                [ -n "$url" ] && curl -fL -o "$OUT_DIR/SukiSU_40548-release.apk" "$url"
                return 0
                ;;
              "Next")
                local repo="KernelSU-Next/KernelSU-Next"
                local ksum="manager"
                local branch="dev"
                local workflow="build-manager-ci.yml"
                local clone_url="https://github.com/KernelSU-Next/KernelSU-Next.git"
                ;;
              "SukiSU")
                local repo="SukiSU-Ultra/SukiSU-Ultra"
                local ksum="manager"
                local branch=""
                local workflow="build-manager.yml"
                local clone_url="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
                ;;
              "BakaSU")
                local repo="Baka-SU/BakaSU"
                local ksum="manager"
                local branch=""
                local workflow="build-manager.yml"
                local clone_url="https://github.com/Baka-SU/BakaSU.git"
                ;;
              "Official"|*)
                local repo="tiann/KernelSU"
                local ksum="manager"
                local branch=""
                local workflow="build-manager.yml"
                local clone_url="https://github.com/tiann/KernelSU.git"
                ;;
            esac

            echo "正在查找 $V 管理器构建..."
            git clone --depth 1 "$clone_url" "kdir_${V}"
            local head_count
            head_count=$(git -C "kdir_${V}" rev-list --count HEAD)
            case "$V" in
              "SukiSU") local target_ver=$((40000 + head_count - 2815)) ;;
              "BakaSU") local target_ver=$((30700 + head_count)) ;;
              "Official") local target_ver=$((20000 + head_count)) ;;
              "Next") local target_ver=$((30000 + head_count)) ;;
              *) local target_ver=$((20000 + head_count)) ;;
            esac

            local runs_url="https://api.github.com/repos/$repo/actions/workflows/$workflow/runs?status=success&per_page=30"
            [ -n "$branch" ] && runs_url="https://api.github.com/repos/$repo/actions/workflows/$workflow/runs?branch=$branch&status=success&per_page=30"

            local download_list=""
            local best_ver=0

            for page in 1 2 3; do
              local runs
              runs=$(curl -s -H "Authorization: token $GH_TOKEN" "$runs_url&page=$page")
              local count
              count=$(printf '%s' "$runs" | jq '.workflow_runs | length' 2>/dev/null || echo 0)
              [ "$count" -eq 0 ] && break

              for idx in $(seq 0 $((count - 1))); do
                local bid hsha
                bid=$(printf '%s' "$runs" | jq -r ".workflow_runs[$idx].id")
                hsha=$(printf '%s' "$runs" | jq -r ".workflow_runs[$idx].head_sha")

                git -C "kdir_${V}" fetch --no-tags origin "$hsha" >/dev/null 2>&1 || true
                if ! git -C "kdir_${V}" cat-file -e "$hsha^{commit}" 2>/dev/null; then
                  continue
                fi

                local c_rev
                c_rev=$(git -C "kdir_${V}" rev-list --count "$hsha")
                local r_ver=0
                case "$V" in
                  "SukiSU") r_ver=$((40000 + c_rev - 2815)) ;;
                  "BakaSU") r_ver=$((30700 + c_rev)) ;;
                  "Official") r_ver=$((20000 + c_rev)) ;;
                  "Next") r_ver=$((30000 + c_rev)) ;;
                esac

                [ "$r_ver" -gt "$target_ver" ] && continue

                local arts
                arts=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$repo/actions/runs/$bid/artifacts")
                local cand=""
                if [ "$V" == "Next" ]; then
                  cand=$(printf '%s' "$arts" | jq -r --arg name "$ksum" '.artifacts[] | select(.name == $name) | "\(.name)\t\(.archive_download_url)"')
                elif [ "$V" == "BakaSU" ]; then
                  cand=$(printf '%s' "$arts" | jq -r '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"')
                else
                  cand=$(printf '%s' "$arts" | jq -r --arg needle "$ksum" '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"')
                fi

                if [ -n "$cand" ] && [ "$r_ver" -gt "$best_ver" ]; then
                  download_list="$cand"
                  best_ver="$r_ver"
                fi
                [ "$r_ver" -eq "$target_ver" ] && break 2
              done
            done

            rm -rf "kdir_${V}"
            if [ -z "$download_list" ]; then
              echo "::warning::未能找到 $V 的 Manager 产物"
              return 1
            fi

            echo "正在下载 $V (版本 $best_ver)..."
            printf '%s\n' "$download_list" | while IFS=$'\t' read -r name url; do
              [ -n "$name" ] && [ -n "$url" ] || continue
              local zname="${V}-tmp.zip"
              curl -sL -H "Authorization: token $GH_TOKEN" -o "$zname" "$url"
              unzip -qo "$zname" -d "$OUT_DIR"
              rm -f "$zname"
            done

            if [ "$V" == "BakaSU" ]; then
              find "$OUT_DIR" -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
              find "$OUT_DIR" -type f -name "*debug*.apk" -delete
            fi
            echo "VER_${V}=$best_ver" >> "$GITHUB_ENV"
          }

          MODE_PARAM="${{ inputs.kernelsu_variant }}"
          [ -z "$MODE_PARAM" ] && MODE_PARAM="All"

          if [ "${{ github.event_name }}" == "schedule" ] || [ "$MODE_PARAM" == "All" ]; then
            echo "执行全量主流变体获取..."
            for var in Official Next SukiSU BakaSU; do
              fetch_manager "$var" "manager-artifacts/$var" || true
            done
            echo "IS_ALL=true" >> "$GITHUB_ENV"
          else
            fetch_manager "$MODE_PARAM" "manager-artifacts"
            echo "HAS_SINGLE=true" >> "$GITHUB_ENV"
            echo "SINGLE_ART_NAME=${MODE_PARAM}-Manager(${KSU_VERSION:-20000})" >> "$GITHUB_ENV"
          fi

      - name: 检查 SUSFS 上游 Commit
        id: check_susfs_upstream
        if: steps.try_reuse.outputs.reused != 'true'
        run: |
          UPSTREAM_REPO="https://github.com/sidex15/susfs4ksu-module.git"
          UPSTREAM_BRANCH="v1.5.2+"
          UPSTREAM_SHA=$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | awk '{print $1}')
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::warning::未能获取上游最新 Commit SHA，使用回退标识"
            UPSTREAM_SHA="unknown"
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_branch=$UPSTREAM_BRANCH" >> "$GITHUB_OUTPUT"
          echo "上游 sidex15/susfs4ksu-module ($UPSTREAM_BRANCH) 最新提交: $UPSTREAM_SHA"

      - name: 恢复 SUSFS 模块缓存
        id: cache_susfs
        if: steps.try_reuse.outputs.reused != 'true' && steps.check_susfs_upstream.outputs.upstream_sha != 'unknown'
        uses: actions/cache@v4
        with:
          path: susfs-module
          key: susfs-module-sidex15-${{ steps.check_susfs_upstream.outputs.upstream_branch }}-${{ steps.check_susfs_upstream.outputs.upstream_sha }}

      - name: 添加 / 构建 SUSFS 模块
        id: add_SUSFS
        if: steps.try_reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          # 检查缓存是否命中且产物完整
          if [ -f "susfs-module/ksu_module_susfs.zip" ]; then
            if unzip -t "susfs-module/ksu_module_susfs.zip" >/dev/null 2>&1; then
              echo "🎉 检测到上游未更新且已命中构建缓存，直接复用已缓存产物，免去重复拉取与构建！"
              SHORT_SHA=$(echo "${{ steps.check_susfs_upstream.outputs.upstream_sha }}" | cut -c1-7)
              SUSFS_NAME="release-1.5.2+_${SHORT_SHA}"
              echo "SUSFS_NAME=$SUSFS_NAME" >> "$GITHUB_ENV"
              exit 0
            else
              echo "缓存中的 ZIP 文件校验失败，清理并重新构建..."
              rm -rf susfs-module
            fi
          fi

          echo "🚀 开始从 sidex15/susfs4ksu-module 源码自主构建 SUSFS 模块..."
          SRC_DIR="sidex15_src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 -b "v1.5.2+" https://github.com/sidex15/susfs4ksu-module.git "$SRC_DIR"

          SHORT_SHA=$(git -C "$SRC_DIR" rev-parse --short HEAD | cut -c1-7)
          echo "上游 Commit SHA: $SHORT_SHA"

          # 确保工具执行权限
          if [ -d "$SRC_DIR/tools" ]; then
            chmod -R 755 "$SRC_DIR/tools"
          fi
          find "$SRC_DIR" -maxdepth 1 -type f -name "*.sh" -exec chmod 755 {} +

          # 规范产物命名，与原版保持完全一致 (release-1.5.2+_<short_sha>)
          SUSFS_NAME="release-1.5.2+_${SHORT_SHA}"

          # 打包模块（使用 Python 打包避免 cd 且保留 755 文件权限）
          mkdir -p susfs-module
          python3 -c "import textwrap; exec(textwrap.dedent('''
              import os, sys, zipfile
              src, out = sys.argv[1], sys.argv[2]
              exclude_prefixes = ('.git', '.github', 'node_modules', 'src', 'tests')
              exclude_files = {'README.md', 'LICENSE'}
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(src):
                      rel_dir = os.path.relpath(root, src)
                      if rel_dir != '.' and any(rel_dir.startswith(p) for p in exclude_prefixes):
                          continue
                      for f in files:
                          if rel_dir == '.' and f in exclude_files:
                              continue
                          full_path = os.path.join(root, f)
                          arcname = os.path.relpath(full_path, src)
                          st = os.stat(full_path)
                          zi = zipfile.ZipInfo.from_file(full_path, arcname)
                          zi.external_attr = (st.st_mode & 0xFFFF) << 16
                          with open(full_path, 'rb') as fp:
                              z.writestr(zi, fp.read())
          '''))" "$SRC_DIR" "susfs-module/ksu_module_susfs.zip"

          # 严格校验产物完整性
          if [ ! -f "susfs-module/ksu_module_susfs.zip" ]; then
            echo "::error::SUSFS 模块构建失败，未生成压缩包"
            exit 1
          fi
          unzip -t "susfs-module/ksu_module_susfs.zip" >/dev/null
          echo "✅ SUSFS 模块自主构建完成并校验通过！"

          rm -rf "$SRC_DIR"
          echo "SUSFS_NAME=$SUSFS_NAME" >> "$GITHUB_ENV"

      - name: 获取 NoMount DEV 模块
        id: add_NoMount
        if: env.HAS_NOMOUNT != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p nomount-module
          echo "🔍 尝试获取 maxsteeel/nomount dev 分支最新成功构建产物..."

          DEV_RUN_ID=$(gh run list --repo maxsteeel/nomount --branch dev --workflow "build module" --status success -L 1 --json databaseId -q '.[0].databaseId' || true)

          SUCCESS=false
          if [ -n "$DEV_RUN_ID" ]; then
            echo "找到最新 dev 构建 Run ID: $DEV_RUN_ID，正在拉取 NoMount 产物..."
            mkdir -p nomount_tmp
            if gh run download "$DEV_RUN_ID" --repo maxsteeel/nomount --pattern "NoMount-*" -D nomount_tmp 2>/dev/null; then
              ART_DIR=$(find nomount_tmp -mindepth 1 -maxdepth 1 -type d -name "NoMount-*" | head -n 1 || true)
              if [ -n "$ART_DIR" ] && [ -f "$ART_DIR/module.prop" ]; then
                ART_NAME=$(basename "$ART_DIR")
                ZIP_NAME="${ART_NAME}.zip"
                echo "正在将 $ART_NAME 打包为 Magisk/KernelSU 模块 ZIP: $ZIP_NAME..."
                python3 -c "import textwrap; exec(textwrap.dedent('''
                    import os, sys, zipfile
                    src, out = sys.argv[1], sys.argv[2]
                    with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                        for root, _, files in os.walk(src):
                            for f in files:
                                full_path = os.path.join(root, f)
                                arcname = os.path.relpath(full_path, src)
                                st = os.stat(full_path)
                                zi = zipfile.ZipInfo.from_file(full_path, arcname)
                                zi.external_attr = (st.st_mode & 0xFFFF) << 16
                                with open(full_path, 'rb') as fp:
                                    z.writestr(zi, fp.read())
                '''))" "$ART_DIR" "nomount-module/$ZIP_NAME"

                if [ -f "nomount-module/$ZIP_NAME" ] && unzip -t "nomount-module/$ZIP_NAME" >/dev/null 2>&1; then
                  echo "🎉 成功获取并打包 NoMount DEV 模块: $ZIP_NAME"
                  SUCCESS=true
                fi
              fi
            fi
            rm -rf nomount_tmp
          fi

          if [ "$SUCCESS" != "true" ]; then
            echo "⚠️ 获取 dev 构建产物失败，尝试回退至 maxsteeel/nomount 官方最新 Release 兜底..."
            REL_URL=$(gh release view -R maxsteeel/nomount --json assets -q '.assets[] | select(.name | startswith("NoMount-") and endswith(".zip")) | .url' | head -n 1 || true)
            if [ -n "$REL_URL" ]; then
              REL_NAME=$(basename "$REL_URL")
              echo "正在下载官方 Release: $REL_NAME"
              curl -fsSL -o "nomount-module/$REL_NAME" "$REL_URL"
              if [ -f "nomount-module/$REL_NAME" ] && unzip -t "nomount-module/$REL_NAME" >/dev/null 2>&1; then
                echo "✅ 官方 Release 兜底拉取成功！"
                SUCCESS=true
              fi
            fi
          fi

          if [ "$SUCCESS" == "true" ]; then
            echo "HAS_NOMOUNT=true" >> "$GITHUB_ENV"
          else
            echo "::warning::未能获取到 NoMount 模块产物"
          fi

      # =========================================================================
      # 产物上传阶段
      # =========================================================================
      # 1. 单变体模式上传 (复用成功或单变体现场获取)
      - name: 上传管理器 APK (单变体)
        if: env.HAS_SINGLE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SINGLE_ART_NAME }}
          path: manager-artifacts/**/*.apk

      # 2. 全量模式分别上传各大变体
      - name: 上传 Official 管理器 APK
        if: env.IS_ALL == 'true' && hashFiles('manager-artifacts/Official/**/*.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: Official-Manager(${{ env.VER_Official || '20000' }})
          path: manager-artifacts/Official/**/*.apk

      - name: 上传 Next 管理器 APK
        if: env.IS_ALL == 'true' && hashFiles('manager-artifacts/Next/**/*.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: Next-Manager(${{ env.VER_Next || '30000' }})
          path: manager-artifacts/Next/**/*.apk

      - name: 上传 SukiSU 管理器 APK
        if: env.IS_ALL == 'true' && hashFiles('manager-artifacts/SukiSU/**/*.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: SukiSU-Manager(${{ env.VER_SukiSU || '40000' }})
          path: manager-artifacts/SukiSU/**/*.apk

      - name: 上传 BakaSU 管理器 APK
        if: env.IS_ALL == 'true' && hashFiles('manager-artifacts/BakaSU/**/*.apk') != ''
        uses: actions/upload-artifact@v6
        with:
          name: BakaSU-Manager(${{ env.VER_BakaSU || '30700' }})
          path: manager-artifacts/BakaSU/**/*.apk

      # 3. 上传 SUSFS 模块
      - name: 上传 SUSFS 模块
        if: steps.add_SUSFS.outcome == 'success' || steps.try_reuse.outputs.reused == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*

      # 4. 上传 NoMount 模块
      - name: 上传 NoMount 模块
        if: env.HAS_NOMOUNT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: nomount-module
          path: ./nomount-module/*
