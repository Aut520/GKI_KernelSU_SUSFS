[package]
name = "mmd"
version = "0.1.0"
edition = "2021"
authors = ["The Android Open Source Project", "Aut"]
description = "Standalone and Lightweight Memory Management Daemon (mmd) for ZRAM Multi-Comp & Recompression"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["time", "fs", "user", "ioctl"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
scopeguard = "1.2"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Maximize size reduction optimizations
panic = "abort"     # Remove unwind tables
strip = true        # Strip symbols
